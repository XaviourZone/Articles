 function formatTrackTime(value){if(value===null||value===undefined||value==='')return '';let raw=value;if(typeof raw==='number'||/^\d{10,13}$/.test(String(raw))){raw=Number(raw);if(raw<1e12)raw*=1000;}const d=new Date(raw);return Number.isNaN(d.getTime())?'':d.toISOString().replace('T',' ').slice(0,19);}
 function nearestTrackPoint(point,points){let best=null,bestD=13*13;for(const p of points){const q=leafletMap.latLngToContainerPoint([p.lat,p.lon]);const dx=q.x-point.x,dy=q.y-point.y,d=dx*dx+dy*dy;if(d<bestD){bestD=d;best=p;}}return best;}
 function showTrackPoint(p){if(!p)return;const stamp=formatTrackTime(p.time);toast('MMSI '+(selected?selected.mmsi:'—')+' · '+(stamp?stamp+' UTC · ':'')+'LAT '+p.lat.toFixed(4)+'° · LON '+p.lon.toFixed(4)+'°');}
 function drawTracks(){sync2DMarkers(true);const points=selected&&selected.points?selected.points:[];$('trackPoints').textContent=points.length.toLocaleString();$('showHistory').disabled=points.length<2;$('showHistory').classList.toggle('active',showHistory);$('showHistory').textContent=showHistory?'HIDE HISTORY':'SHOW HISTORY';const validTimes=points.map(p=>{const t=formatTrackTime(p.time);return t?Date.parse(t+'Z'):NaN;}).filter(Number.isFinite);$('trackRange').textContent=validTimes.length?new Date(Math.min(...validTimes)).toISOString().slice(0,10)+' — '+new Date(Math.max(...validTimes)).toISOString().slice(0,10):'TIME UNAVAILABLE';}
 function parseHistory(data){
  const out=[];function push(lat,lon,time){lat=Number(lat);lon=Number(lon);if(valid(lat)&&valid(lon)&&Math.abs(lat)<=90&&Math.abs(lon)<=180)out.push({lat,lon,time:time||''});}
  function visit(x){if(!x)return;if(Array.isArray(x)){for(const a of x){if(Array.isArray(a)&&a.length>=2&&typeof a[0]==='number')push(a[1],a[0]);else if(a&&typeof a==='object')visit(a);}return;}if(x.type==='FeatureCollection'&&Array.isArray(x.features)){x.features.forEach(visit);return;}if(x.type==='Feature'&&x.geometry){visit(x.geometry);return;}if(x.type==='LineString'&&Array.isArray(x.coordinates)){visit(x.coordinates);return;}if(x.geometry){visit(x.geometry);return;}const lat=x.lat??x.latitude??x.Latitude,lon=x.lon??x.lng??x.longitude??x.Longitude;if(lat!==undefined&&lon!==undefined){push(lat,lon,x.time??x.time_utc??x.timestamp??x.timestamp_utc);return;}for(const k of ['positions','history','track','points','data','results','coordinates'])if(x[k]){visit(x[k]);return;}}
  visit(data);return out;
 }
 async function loadHistory(s){historyLoading=true;$('trackNote').textContent='Loading recent public AIS history…';try{const res=await fetch(API+'/history/'+encodeURIComponent(s.mmsi),{headers:{Accept:'application/json'}});if(!res.ok)throw new Error('History endpoint returned HTTP '+res.status);const data=await res.json(),points=parseHistory(data);if(selected&&selected.mmsi===s.mmsi){const live=s.points||[],merged=[...points,...live].filter((p,i,a)=>i===0||p.lat!==a[i-1].lat||p.lon!==a[i-1].lon);s.points=merged.slice(-MAX_POINTS);selected=s;$('trackNote').textContent=points.length?'Loaded '+points.length+' recent historical fixes. New live AIS reports will extend this track.':'No historical fixes returned yet. The live trail will grow as new reports arrive.';drawTracks();}}catch(err){if(selected&&selected.mmsi===s.mmsi)$('trackNote').textContent='Historical track unavailable right now ('+err.message+'). Live trail is still recording new positions.';}finally{historyLoading=false;}}
 function updateDetail(s){$('shipSource').textContent=s.source||'AIS';$('shipName').textContent=s.name||'Unknown vessel';$('shipMmsi').textContent='MMSI '+s.mmsi;$('sog').textContent=Number.isFinite(s.sog)&&s.sog<102?' '+fmt(s.sog,1)+' kn':'—';$('cog').textContent=Number.isFinite(s.cog)&&s.cog<=360?fmt(s.cog,0)+'°':'—';$('shipType').textContent=s.type||'Unknown';$('imo').textContent=s.imo||'—';$('lat').textContent=fmt(s.lat,4)+'°';$('lon').textContent=fmt(s.lon,4)+'°';$('lastReportTime').textContent=formatTrackTime(s.time)||'—';if(s.points&&s.points.length)$('trackPoints').textContent=s.points.length.toLocaleString();}
 function selectVessel(v){const s=vessels.get(v.mmsi)||v;selected=s;$('detail').classList.add('show');updateDetail(s);loadVesselPhoto(s);sync2DMarkers(true);if(leafletMap){leafletMap.setView([s.lat,s.lon],Math.max(leafletMap.getZoom(),8),{animate:true});sync2DMarkers(true);}$('trackNote').textContent='Loading recent public AIS history…';loadHistory(s);drawTracks();}
 $('showHistory').onclick=()=>{if(!selected||!selected.points||selected.points.length<2)return;showHistory=!showHistory;drawTracks();};
 $('close').onclick=()=>{$('detail').classList.remove('show');selected=null;showHistory=false;if(trackTooltip&&leafletMap)if(trackTooltip){trackTooltip.remove();trackTooltip=null;}drawTracks();scheduleRender();};
 function connect(){clearTimeout(retryTimer);if(ws){try{ws.onclose=null;ws.close();}catch(e){}}setStatus('CONNECTING');ws=new WebSocket(WS);ws.onopen=()=>{retry=0;setStatus('LIVE',true);const sub={BoundingBoxes:[[[-41.5,-180],[41.5,180]]],FilterMessageTypes:['PositionReport','StandardClassBPositionReport','ExtendedClassBPositionReport','LongRangeAisBroadcastMessage'],InitialState:true};ws.send(JSON.stringify(sub));toast('Connected to OpenSeaFeed — warming vessel state');};ws.onmessage=ev=>{try{const raw=typeof ev.data==='string'?ev.data:new TextDecoder().decode(ev.data),frame=JSON.parse(raw);if(['PositionReport','StandardClassBPositionReport','ExtendedClassBPositionReport','LongRangeAisBroadcastMessage'].includes(frame.MessageType)){const v=decodeFrame(frame);if(v)addPosition(v);}else if(frame.type==='error'||frame.error){setStatus('FEED NOTICE');toast(frame.error||'Provider notice');}}catch(e){}};ws.onerror=()=>setStatus('RETRYING');ws.onclose=()=>{setStatus('OFFLINE');const wait=Math.min(30000,1200*Math.pow(2,retry++));retryTimer=setTimeout(connect,wait);};}
 const suggestionBox=$('suggestions');let suggestionItems=[],suggestionIndex=-1,searchCache=[],searchCacheAt=0;
 function getSearchCache(){if(Date.now()-searchCacheAt>2500){searchCache=[...vessels.values()];searchCacheAt=Date.now();}return searchCache;}
 function closeSuggestions(){suggestionBox.classList.remove('open');suggestionBox.innerHTML='';suggestionItems=[];suggestionIndex=-1;}
 function chooseSuggestion(v){$('vesselSearch').value=v.mmsi;closeSuggestions();$('searchHint').textContent='Found '+(v.name||'vessel')+' · '+v.mmsi;selectVessel(v);}
 function renderSuggestions(){const q=$('vesselSearch').value.trim().toUpperCase();if(q.length<2){closeSuggestions();$('searchHint').textContent='Type 2+ characters for live suggestions';return;}
  const all=getSearchCache();const matches=all.filter(v=>String(v.mmsi).includes(q)||String(v.imo||'').toUpperCase().includes(q)||String(v.name||'').toUpperCase().includes(q)).sort((a,b)=>{const ae=String(a.mmsi)===q||String(a.imo||'').toUpperCase()===q?0:1,be=String(b.mmsi)===q||String(b.imo||'').toUpperCase()===q?0:1;return ae-be;}).slice(0,8);
  suggestionItems=matches;suggestionIndex=-1;suggestionBox.innerHTML='';
  if(!matches.length){closeSuggestions();$('searchHint').textContent='No loaded vessel matches yet · '+all.length.toLocaleString()+' contacts indexed';return;}
  for(const v of matches){const b=document.createElement('button');b.type='button';b.className='suggestion';b.setAttribute('role','option');const left=document.createElement('span'),name=document.createElement('strong'),sub=document.createElement('small'),kind=document.createElement('em');name.textContent=v.name||'Unknown vessel';sub.textContent='MMSI '+v.mmsi+(v.imo?' · IMO '+v.imo:'');kind.textContent=Number.isFinite(v.sog)&&v.sog<102?fmt(v.sog,1)+' kn':'AIS';left.append(name,sub);b.append(left,kind);b.addEventListener('click',()=>chooseSuggestion(v));suggestionBox.append(b);}
  suggestionBox.classList.add('open');$('searchHint').textContent=matches.length+' matching loaded contact'+(matches.length===1?'':'s')+' · select to locate';
 }
 function searchVessel(){const q=$('vesselSearch').value.trim().toUpperCase();if(!q){$('searchHint').textContent='Enter a MMSI, IMO or vessel name';return;}
  const all=getSearchCache();let hit=all.find(v=>String(v.mmsi).toUpperCase()===q||String(v.imo||'').toUpperCase()===q);
  if(!hit)hit=all.find(v=>String(v.name||'').toUpperCase()===q);if(!hit)hit=all.find(v=>String(v.name||'').toUpperCase().includes(q));
  if(!hit){$('searchHint').textContent='No match in '+all.length.toLocaleString()+' loaded vessels';toast('Vessel not present in current loaded data');closeSuggestions();return;}
  chooseSuggestion(hit);if(leafletMap)leafletMap.setView([hit.lat,hit.lon],Math.max(leafletMap.getZoom(),8),{animate:true});
 }
 $('searchGo').onclick=searchVessel;$('vesselSearch').addEventListener('input',renderSuggestions);$('vesselSearch').addEventListener('focus',renderSuggestions);
 $('vesselSearch').addEventListener('keydown',e=>{if(e.key==='ArrowDown'&&suggestionItems.length){e.preventDefault();suggestionIndex=Math.min(suggestionIndex+1,suggestionItems.length-1);suggestionBox.querySelectorAll('.suggestion').forEach((b,i)=>b.classList.toggle('active',i===suggestionIndex));}else if(e.key==='ArrowUp'&&suggestionItems.length){e.preventDefault();suggestionIndex=Math.max(0,suggestionIndex-1);suggestionBox.querySelectorAll('.suggestion').forEach((b,i)=>b.classList.toggle('active',i===suggestionIndex));}else if(e.key==='Enter'){e.preventDefault();if(suggestionIndex>=0&&suggestionItems[suggestionIndex])chooseSuggestion(suggestionItems[suggestionIndex]);else searchVessel();}else if(e.key==='Escape')closeSuggestions();});
 document.addEventListener('click',e=>{if(!$('searchPanel').contains(e.target))closeSuggestions();});
 // Automatic reconnect is handled by the feed connection manager.
 // Native anonymous Open Waters live stream. Open Waters aggregates partner feeds,
 // including AISStream; AISHub positions are included in its periodic upstream snapshots.
 let openWatersLive=null,openWatersLiveRetry=0,openWatersLiveTimer=null;
 function connectOpenWatersLive(){
  clearTimeout(openWatersLiveTimer);try{if(openWatersLive)openWatersLive.close();}catch(e){}
  try{
   openWatersLive=new WebSocket('wss://ais.openwaters.io/v1/stream');
   openWatersLive.onopen=()=>{openWatersLiveRetry=0;openWatersLive.send(JSON.stringify({type:'subscribe',bbox:[[-5,70,5,80]],snapshot:true}));console.info('Open Waters live stream subscribed: Central Indian Ocean');};
   openWatersLive.onmessage=ev=>{try{const event=JSON.parse(ev.data);if(event.type!=='event')return;const mmsi=String(event.mmsi||'');const lat=Number(event.lat),lon=Number(event.lon);if(!/^\d{9}$/.test(mmsi)||!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)return;addPosition({mmsi,lat,lon,name:String(event.name||event.ship_name||''),type:event.type_code??event.ship_type??'',imo:event.imo??'',sog:Number(event.sog),cog:Number(event.cog),heading:Number(event.heading),time:event.time||new Date().toISOString(),source:'Open Waters Live'},false);}catch(err){console.warn('Open Waters live event decode failed',err);}};
   openWatersLive.onerror=()=>console.warn('Open Waters live stream connection error');
   openWatersLive.onclose=()=>{openWatersLiveTimer=setTimeout(connectOpenWatersLive,Math.min(60000,2500*Math.pow(2,openWatersLiveRetry++)));};
  }catch(err){console.warn('Open Waters live stream unavailable',err);}
 }
 const OPEN_WATERS_AREAS=[
  {name:'Gulf of Aden',bbox:'5,45,14,54'},
  {name:'Red Sea',bbox:'15,35,24,44'},
  {name:'Arabian Gulf',bbox:'20,45,29,54'},
  {name:'Arabian Sea',bbox:'5,60,14,69'},
  {name:'Central Indian Ocean',bbox:'-5,70,4,79'},
  {name:'Bay of Bengal',bbox:'5,80,14,89'},
  {name:'Sri Lanka approaches',bbox:'0,75,9,84'},
  {name:'Andaman Sea',bbox:'5,90,14,99'},
  {name:'Malacca Strait',bbox:'0,95,9,104'},
  {name:'South China Sea',bbox:'5,110,14,119'},
  {name:'East China Sea',bbox:'20,120,29,129'},
  {name:'Japan approaches',bbox:'30,130,39,139'},
  {name:'North Sea',bbox:'50,0,59,9'},
  {name:'English Channel',bbox:'45,-5,54,4'},
  {name:'Western Mediterranean',bbox:'35,-5,44,4'},
  {name:'Caribbean Sea',bbox:'10,-80,19,-71'}
 ];
 let openWatersAreaIndex=0;
 async function loadOpenWaters(){
  const area=OPEN_WATERS_AREAS[openWatersAreaIndex++%OPEN_WATERS_AREAS.length];
  try{
   // Anonymous Open Waters requests are capped at 100 square degrees per request.
   // Rotate eight high-traffic 10° × 10° corridors, one every five seconds.
   // API defaults: stationary contacts up to 7 days; moving contacts up to 30 minutes.
   const res=await fetch('https://ais.openwaters.io/v1/vessels?bbox='+area.bbox,{headers:{Accept:'application/geo+json, application/json'}});
   if(!res.ok)throw new Error('Open Waters HTTP '+res.status);
   const data=await res.json(),features=Array.isArray(data.features)?data.features:[];
   let merged=0;
   for(const f of features){
    const p=f.properties||{},coords=f.geometry&&f.geometry.coordinates;
    if(!coords||coords.length<2)continue;
    const mmsi=String(p.mmsi??f.id??'');if(!/^\d{9}$/.test(mmsi))continue;
    const seen=p.seen??p.time??p.timestamp??new Date().toISOString();
    addPosition({mmsi,lat:Number(coords[1]),lon:Number(coords[0]),name:String(p.name||''),type:p.type??'',imo:p.imo??'',sog:Number(p.sog),cog:Number(p.cog),heading:Number(p.heading),time:seen,source:'Open Waters · '+String(p.source||'AIScast')},true);
    merged++;
   }
   // Provider attribution is retained in diagnostics only; no redundant source panel.
   console.info('OPEN OCEANS: Open Waters corridor sync.',{area:area.name,features:features.length,merged,unique:vessels.size,attribution:data.attribution||null});
   
  }catch(err){console.warn('OPEN OCEANS: Open Waters '+area.name+' source unavailable.',err);}
 }
 async function loadVesselPhoto(s){
  const panel=$('shipPhoto'),credit=$('photoCredit');if(!panel||!credit)return;
  const mmsi=String(s.mmsi),name=(s.name||'').trim();
  panel.innerHTML='<div class="photoempty">VESSEL IMAGE<br><span>Checking vessel photo catalogues…</span></div>';credit.textContent='';
  const showPhoto=(url,source,caption)=>new Promise(resolve=>{
   if(!url||typeof url!=='string')return resolve(false);
   const img=document.createElement('img');img.src=url;img.alt='Vessel photograph: '+(name||mmsi);img.loading='eager';img.referrerPolicy='no-referrer';
   img.onload=()=>{if(!selected||selected.mmsi!==mmsi)return resolve(false);panel.replaceChildren(img);const link=document.createElement('a');link.href=source||url;link.target='_blank';link.rel='noopener';link.textContent=caption||'Photo source';credit.replaceChildren(document.createTextNode('Photo: '),link);resolve(true);};
   img.onerror=()=>resolve(false);
  });
  const strip=v=>String(v||'').replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').trim();
  const candidates=d=>{
   if(!d)return [];
   const arr=Array.isArray(d)?d:Array.isArray(d.photos)?d.photos:Array.isArray(d.results)?d.results:Array.isArray(d.images)?d.images:[d.photo||d];
   return arr.map(p=>({url:p?.urls?.mmsi||p?.urls?.cfr||p?.thumb||p?.thumbnail||p?.thumbnail_url||p?.image||p?.image_url||p?.url||p?.src,
    page:p?.page||p?.pageUrl||p?.descriptionurl||p?.foreign_landing_url||p?.url||'',
    credit:p?.attribution||p?.credit||p?.artist||p?.creator||'Photographer',
    licence:p?.licenceName||p?.license||p?.licence||'See source licence'})).filter(x=>x.url);
  };
  // 1. OpenSeaFeed free-licensed vessel-photo endpoint.
  try{
   const r=await fetch('https://api.openseafeed.com/v1/photos/'+encodeURIComponent(mmsi),{headers:{Accept:'application/json'}});
   if(r.ok){const d=await r.json();for(const p of candidates(d)){if(await showPhoto(p.url,p.page||'https://openseafeed.com/',p.credit+' · '+p.licence+' · OpenSeaFeed'))return;}}
  }catch(e){console.info('OpenSeaFeed photo lookup unavailable:',e);}
  // 2. Open Vessel Photos JSON. Its documented schema uses photos[].urls.mmsi.
  try{
   const r=await fetch('https://openvesselphotos.org/v1/mmsi/'+encodeURIComponent(mmsi),{headers:{Accept:'application/json'}});
   if(r.ok){const d=await r.json();for(const p of candidates(d)){if(await showPhoto(p.url,p.page||'https://openvesselphotos.org/',(p.credit||'Photographer')+' · '+(p.licence||'Open licence')+' · Open Vessel Photos'))return;}}
   else if(r.status!==404)console.info('Open Vessel Photos HTTP',r.status);
  }catch(e){console.info('Open Vessel Photos lookup unavailable:',e);}
  // 3. Direct main-photo URL from the same open catalogue.
  if(await showPhoto('https://openvesselphotos.org/v1/mmsi/'+encodeURIComponent(mmsi)+'.jpg?size=800','https://openvesselphotos.org/','Open Vessel Photos · vessel catalogue'))return;
  // 4. Wikimedia Commons anonymous CORS search, retaining attribution and licence.
  const normalized=name.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  const queries=[name,name&&'"'+name+'" ship',name&&'"'+name+'" vessel',s.imo&&'IMO '+s.imo].filter(Boolean);
  for(const q of queries){
   try{
    const p=new URLSearchParams({action:'query',format:'json',origin:'*',generator:'search',gsrsearch:q,gsrnamespace:'6',gsrlimit:'30',prop:'imageinfo',iiprop:'url|extmetadata',iiurlwidth:'1000',iiextmetadatafilter:'LicenseShortName|Artist|Credit'});
    const r=await fetch('https://commons.wikimedia.org/w/api.php?'+p,{headers:{Accept:'application/json','Api-User-Agent':'OpenOceansTracker/1.0 (https://xaviourzone.github.io/Articles/FREESHIPPING/)'}});
    if(!r.ok)continue;
    const d=await r.json(),tokens=normalized.split(' ').filter(t=>t.length>2);
    const ranked=Object.values(d.query?.pages||{}).map(x=>{
     const title=(x.title||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
     const exact=normalized.length>3&&title.includes(normalized);
     const score=tokens.filter(t=>title.includes(t)).length;
     return {x,score:exact?100+score:score};
    }).filter(x=>x.score>0&&x.x.imageinfo?.[0]?.thumburl&&(normalized.length<=3?x.score>=1:x.score>=Math.min(2,tokens.length))).sort((a,b)=>b.score-a.score);
    for(const item of ranked.slice(0,5)){
     const info=item.x.imageinfo[0],meta=info.extmetadata||{};
     const author=strip(meta.Artist?.value||meta.Credit?.value)||'Wikimedia contributor',lic=strip(meta.LicenseShortName?.value)||'See file licence';
     if(await showPhoto(info.thumburl,info.descriptionurl||'https://commons.wikimedia.org/',author+' · '+lic+' · Wikimedia Commons'))return;
    }
   }catch(e){console.info('Wikimedia Commons lookup unavailable:',e);}
  }
  if(!selected||selected.mmsi!==mmsi)return;
  panel.innerHTML='<div class="photoempty">NO VERIFIED PHOTO FOUND<br><span>Try external vessel-image searches</span></div>';credit.replaceChildren();
  const q=encodeURIComponent([name,s.imo&&'IMO '+s.imo,'MMSI '+mmsi].filter(Boolean).join(' '));
  [['Google Images','https://www.google.com/search?tbm=isch&q='+q],['Bing Images','https://www.bing.com/images/search?q='+q],['Brave Images','https://search.brave.com/images?q='+q]].forEach(([label,url],i)=>{if(i)credit.append(document.createTextNode(' · '));const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener';link.textContent=label;credit.append(link);});
 }

 function ageLabel(ms){const sec=Math.floor(ms/1000);if(sec<60)return sec+'s';const min=Math.floor(sec/60);if(min<60)return min+'m '+(sec%60)+'s';return Math.floor(min/60)+'h '+(min%60)+'m';}

 // Optional AISStream relay. The API key is held only as a Cloudflare Worker secret.
 let aisStreamSocket=null,aisStreamRetry=0,aisStreamTimer=null;
 function connectAISStreamProxy(){
  if(!AISSTREAM_PROXY_URL){console.info('AISStream relay not activated: deploy the secure Worker and set AISSTREAM_PROXY_URL.');return;}
  clearTimeout(aisStreamTimer);
  try{if(aisStreamSocket)aisStreamSocket.close();}catch(e){}
  try{
   aisStreamSocket=new WebSocket(AISSTREAM_PROXY_URL);
   aisStreamSocket.onopen=()=>{aisStreamRetry=0;console.info('AISStream secure relay connected.');toast('AISStream relay connected');};
   aisStreamSocket.onmessage=ev=>{
    try{
     const frame=JSON.parse(typeof ev.data==='string'?ev.data:new TextDecoder().decode(ev.data));
     if(frame.type==='proxy_status'){if(frame.status==='connected')console.info('AISStream upstream authenticated by secure relay');return;}
     const v=decodeFrame(frame);
     if(v){v.source='AISStream';addPosition(v);}
    }catch(err){console.warn('AISStream frame decode failed',err);}
   };
   aisStreamSocket.onerror=()=>console.warn('AISStream secure relay connection error');
   aisStreamSocket.onclose=()=>{aisStreamTimer=setTimeout(connectAISStreamProxy,Math.min(60000,2500*Math.pow(2,aisStreamRetry++)));};
  }catch(err){console.warn('AISStream relay unavailable',err);aisStreamTimer=setTimeout(connectAISStreamProxy,15000);}
 }
 connectAISStreamProxy();
 try{connect();}catch(err){setStatus('STARTUP ERROR');$('trackNote').textContent='Startup error: '+(err&&err.message?err.message:String(err));console.error('OPEN OCEANS startup error:',err);}
 });
