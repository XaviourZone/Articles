<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" width="160" height="50" fill="none">
  <!-- Query Box -->
  <rect x="6" y="8" width="40" height="34" rx="6" fill="#F0EAFF" stroke="#8877E8" stroke-width="1.2"/>
  <text x="26" y="22" font-family="Space Grotesk, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#6554C8">QUERY</text>
  <text x="26" y="34" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" fill="#716D79">Q: "cat"</text>

  <!-- Multiply Cross Icon -->
  <circle cx="58" cy="25" r="7" fill="#FFFFFF" stroke="#D5CBBD" stroke-width="1"/>
  <text x="58" y="28" font-family="Space Grotesk, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#24232B">×</text>

  <!-- Key Box -->
  <rect x="74" y="8" width="40" height="34" rx="6" fill="#FFF8EB" stroke="#E7A35A" stroke-width="1.2"/>
  <text x="94" y="22" font-family="Space Grotesk, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#B45309">KEY</text>
  <text x="94" y="34" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" fill="#716D79">K: "stare"</text>

  <!-- Arrow -->
  <path d="M118 25 H128 M125 21 L129 25 L125 29" stroke="#6554C8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Attention Score Weight -->
  <rect x="132" y="12" width="24" height="26" rx="5" fill="#E8F8F2" stroke="#63C9AC" stroke-width="1.2"/>
  <text x="144" y="24" font-family="Space Grotesk, sans-serif" font-size="8" font-weight="700" text-anchor="middle" fill="#127552">SOFTMAX</text>
  <text x="144" y="34" font-family="JetBrains Mono, monospace" font-size="8" font-weight="800" text-anchor="middle" fill="#127552">92%</text>
</svg>
