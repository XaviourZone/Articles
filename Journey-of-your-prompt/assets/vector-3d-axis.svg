<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60" fill="none">
  <!-- 3D Axes -->
  <!-- Origin -->
  <circle cx="20" cy="40" r="3" fill="#6554C8"/>
  <!-- Y Axis (Up - Teal) -->
  <line x1="20" y1="40" x2="20" y2="8" stroke="#63C9AC" stroke-width="2"/>
  <polygon points="20,5 17,10 23,10" fill="#63C9AC"/>
  <!-- X Axis (Right - Lavender) -->
  <line x1="20" y1="40" x2="52" y2="40" stroke="#8877E8" stroke-width="2"/>
  <polygon points="55,40 50,37 50,43" fill="#8877E8"/>
  <!-- Z Axis (Projected - Amber) -->
  <line x1="20" y1="40" x2="6" y2="52" stroke="#E7A35A" stroke-width="2"/>
  <polygon points="4,54 7,49 10,53" fill="#E7A35A"/>
  
  <!-- Floating Vector Token Sphere -->
  <line x1="20" y1="40" x2="42" y2="18" stroke="#6554C8" stroke-width="1.5" stroke-dasharray="2 2"/>
  <circle cx="42" cy="18" r="6" fill="#6554C8"/>
  <circle cx="42" cy="18" r="9" stroke="#8877E8" stroke-width="1.2" opacity="0.6"/>
</svg>
