<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120" width="80" height="120" fill="none">
  <!-- Outer Transformer Block Housing -->
  <rect x="4" y="4" width="72" height="112" rx="10" fill="#ffffff" stroke="#d5cbbe" stroke-width="2"/>
  
  <!-- Residual Bypass Rail -->
  <path d="M12 110 V14" stroke="#d97706" stroke-width="1.8" stroke-dasharray="3 3"/>
  <circle cx="12" cy="14" r="2.5" fill="#d97706"/>
  <circle cx="12" cy="110" r="2.5" fill="#d97706"/>
  
  <!-- Feed Forward Sub-layer -->
  <rect x="22" y="16" width="48" height="26" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="46" y="32" font-family="Plus Jakarta Sans, sans-serif" font-size="8" font-weight="700" text-anchor="middle" fill="#92400e">FFN (GELU)</text>
  
  <!-- Add & Norm Junction -->
  <circle cx="46" cy="50" r="6" fill="#f5f1eb" stroke="#8c857b" stroke-width="1.2"/>
  <path d="M43 50 H49 M46 47 V53" stroke="#1f1d1b" stroke-width="1.2"/>
  
  <!-- Multi-Head Attention Sub-layer -->
  <rect x="22" y="64" width="48" height="28" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="46" y="81" font-family="Plus Jakarta Sans, sans-serif" font-size="8" font-weight="700" text-anchor="middle" fill="#3730a3">Multi-Head Attn</text>
  
  <!-- Input Norm -->
  <rect x="26" y="98" width="40" height="12" rx="4" fill="#faf8f5" stroke="#d5cbbe" stroke-width="1.2"/>
  <text x="46" y="107" font-family="Plus Jakarta Sans, sans-serif" font-size="6.5" font-weight="600" text-anchor="middle" fill="#57524d">LayerNorm</text>
</svg>
